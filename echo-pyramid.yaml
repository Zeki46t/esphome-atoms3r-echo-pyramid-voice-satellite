---
# AtomS3R + Atomic Echo Pyramid -> Home Assistant voice assistant satellite
#
# Changes from the M5Stack example:
#  1. Removed the "switch: platform: aw87559" block (not available in the
#     current M5Stack component; the aw87559 hub entry below is kept).
#  2. Display rebuilt for the newer AtomS3R revision (ST7735 panel); see the
#     display section and the README for older GC9107 units.
#  3. Speaker/media player sample rate set to 16000 so it matches the mic
#     on the shared I2S bus (the example asked for 48000 on a 16000 speaker).
#  4. Microphone channel set to mono (left).
#  5. Removed the unused "stop" and "peppa pig" wake word models.
#  6. Casita images replaced with code-drawn animations (no image files).
#  7. Pyramid RGB strips show the assistant state (switch: "Status LEDs").
#  8. Volume swipes show an on-screen bar, are capped (see max_volume), and keep the
#     "Master Volume" entity in sync; volume is restored on boot.
#  9. Secrets moved to secrets.yaml; diagnostic sensors added.

substitutions:
  name: echo-pyramid
  friendly_name: Echo-Pyramid

  # Fonts
  mdi_webfont_file: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf

  # Audio files
  wake_word_trigger_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  error_cloud_expired_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

  # Highest volume the speaker is allowed to reach (0.0 - 1.0)
  max_volume: "0.4"

  # Phases of the voice assistant
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"
  voice_assist_timer_finished_phase_id: "20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.3
  on_boot:
    - priority: 600
      then:
        # Fallback: leave the "initializing" screen after 30 s even if Home
        # Assistant never connects
        - delay: 30s
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: draw_display
    - priority: -100
      then:
        # Apply the saved volume (otherwise the player starts at volume_initial
        # while Home Assistant shows the saved value) and sync the entity
        - lambda: id(current_volume) = std::min(id(current_volume), (float) ${max_volume});
        - media_player.volume_set:
            id: echo_pyramid_player
            volume: !lambda return id(current_volume);
        - lambda: id(master_volume).publish_state(id(current_volume));

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Echo-Pyramid Fallback Hotspot"
    password: !secret ap_password
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

logger:
  level: DEBUG
  logs:
    sensor: WARN
    pyramidrgb: INFO   # the component logs every single LED write at DEBUG

captive_portal:

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true
  # Lets you reboot from Home Assistant while the log window is open,
  # so the full startup log (including display init) is captured.
  - platform: restart
    name: "Restart"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    id: user_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - switch.turn_off: timer_ringing
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [aw87559, si5351, lp5562, pyramidrgb, pyramidtouch]
    refresh: 0s

# ---------------------------------------------------------------- I2C
i2c:
  - id: bsp_bus          # AtomS3R internal (LP5562 backlight)
    sda: GPIO45
    scl: GPIO0
    scan: true
  - id: ext_bus          # Echo base / pyramid
    sda: GPIO38
    scl: GPIO39
    scan: true

pi4ioe5v6408:
  - id: pi4ioe5v6408_hub
    i2c_id: ext_bus
    address: 0x43

aw87559:
  id: audio_amp
  i2c_id: ext_bus
  address: 0x5B

si5351:
  id: clock_gen
  i2c_id: ext_bus
  address: 0x60

# ---------------------------------------------------------------- Audio
# Voice/Echo Pyramid pin map (matches M5Stack's Voice Pyramid docs)
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO6

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: ext_bus
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: ext_bus
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_audio_id: i2s_audio_bus
    sample_rate: 16000
    i2s_din_pin: GPIO5
    bits_per_sample: 16bit
    adc_type: external
    channel: left        # if the mic is silent, try "right"

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO7
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: mono
    audio_dac: es8311_dac

media_player:
  - platform: speaker
    name: "Echo Pyramid Player"
    id: echo_pyramid_player
    volume_min: 0.0
    volume_max: 1.0
    volume_initial: 0.10
    announcement_pipeline:
      speaker: i2s_speaker
      format: FLAC
      sample_rate: 16000     # must match the speaker / mic bus rate
      num_channels: 1
    files:
      - id: wake_word_triggered_sound
        file: ${wake_word_trigger_sound_file}
      - id: timer_finished_sound
        file: ${timer_finished_sound_file}
      - id: error_cloud_expired
        file: ${error_cloud_expired_file}
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            - if:
                condition:
                  - lambda: |-
                      return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      # User-started media playback (not the wake chime): show the muted display
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(voice_assistant_phase) != ${voice_assist_listening_phase_id};
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
      # The assistant's reply audio has started: switch thinking -> replying now,
      # so the screen and lights match what you hear
      - if:
          condition:
            and:
              - voice_assistant.is_running:
              - lambda: return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
            - script.execute: draw_display
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            # Keep the "listening" display while the wake chime ends and the
            # pipeline is starting
            - if:
                condition:
                  lambda: return id(voice_assistant_phase) != ${voice_assist_listening_phase_id};
                then:
                  - script.execute: set_idle_or_mute_phase
                  - script.execute: draw_display

switch:
  # NS4150B speaker amp enable
  - platform: gpio
    name: Speaker Enable
    pin:
      pi4ioe5v6408: pi4ioe5v6408_hub
      number: 0
      mode:
        output: true
    icon: "mdi:volume-high"
    # Always on at boot, and kept out of voice control: asking Assist to "turn off the
    # bedroom lights" was also turning this switch off
    entity_category: config
    restore_mode: ALWAYS_ON

  - platform: template
    name: Mute Microphone
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    on_turn_on:
      - microphone.mute:
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

  # Turn off to skip the wake chime: the assistant then starts listening about
  # a second sooner
  - platform: template
    name: "Wake sound"
    id: wake_sound
    icon: "mdi:bell-ring"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    name: "Status LEDs"
    id: status_leds
    icon: "mdi:led-strip-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(led_applied_phase) = -1;
      - script.execute: update_leds
    on_turn_off:
      - script.execute: leds_off

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - lambda: |-
          id(echo_pyramid_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
            .set_announcement(true)
            .perform();
          id(echo_pyramid_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - media_player.stop:
          announcement: true
      - script.execute: start_wake_word
      - lambda: id(led_applied_phase) = -1;
      - script.execute: update_leds
    on_turn_on:
      - script.execute: stop_wake_word
      - script.execute:
          id: set_led_color
          r: 1.0
          g: 0.6
          b: 0.0
      - lambda: |-
          id(echo_pyramid_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
            .set_announcement(true)
            .perform();
          id(echo_pyramid_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start

  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);
          id(hey_jarvis).set_probability_cutoff(247);
          id(hey_mycroft).set_probability_cutoff(253);
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);
          id(hey_jarvis).set_probability_cutoff(235);
          id(hey_mycroft).set_probability_cutoff(242);
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);
          id(hey_jarvis).set_probability_cutoff(212);
          id(hey_mycroft).set_probability_cutoff(237);
        }

micro_wake_word:
  id: mww
  microphone: i2s_mic
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
  vad:
  on_wake_word_detected:
    # Mark "listening" first so the wake chime doesn't trigger the muted display
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    # Screen feedback right away (fast); LEDs follow below (slow I2C writes)
    - display.page.show: listening_page
    - component.update: atoms3r_lcd
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return const_cast<audio::AudioFile*>(id(wake_word_triggered_sound));
          # LED writes take ~0.4 s; do them while the chime plays
          - script.execute: update_leds
          - wait_until:
              condition:
                - media_player.is_announcing:
              timeout: 0.5s
          - wait_until:
              - and:
                  - not:
                      media_player.is_announcing:
                  - not:
                      speaker.is_playing:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - if:
        condition:
          switch.is_off: wake_sound
        then:
          - script.execute: update_leds
    # Safety net: if the assistant never started (e.g. Home Assistant not
    # connected), don't stay on the "listening" display
    - wait_until:
        condition:
          voice_assistant.is_running:
        timeout: 3s
    - if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - lambda: return id(voice_assistant_phase) == ${voice_assist_listening_phase_id};
        then:
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display

voice_assistant:
  id: va
  microphone: i2s_mic
  media_player: echo_pyramid_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - if:
        condition:
          - lambda: |-
              return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return const_cast<audio::AudioFile*>(id(error_cloud_expired));
          - script.execute: draw_display
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        media_player.is_announcing:
    - lambda: id(voice_assistant_phase) = ${voice_assist_timer_finished_phase_id};

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: current_volume
    type: float
    restore_value: true
    initial_value: '0.3'
  # Phase the strip LEDs were last set for (-1 = force the next update)
  - id: led_applied_phase
    type: int
    restore_value: false
    initial_value: "-1"

# ---------------------------------------------------------------- Touch / LEDs
sensor:
  - platform: pyramidtouch
    address: 0x1A
    i2c_id: ext_bus
    update_interval: 50ms
    publish_swipe_event: true
    swipe_timeout_ms: 500
    touch1:
      name: "Touch 1"
      filters:
        - delta: 0.5
    touch2:
      name: "Touch 2"
      filters:
        - delta: 0.5
    touch3:
      name: "Touch 3"
      filters:
        - delta: 0.5
    touch4:
      name: "Touch 4"
      filters:
        - delta: 0.5
    swipe_event:
      name: "Touch Swipe Event"
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              // 1 = Left Up (vol up), 2 = Left Down (vol down)
              // 3 = Right Up (brightness up), 4 = Right Down (brightness down)
              const float volume_step = 0.05f;
              const float brightness_step = 5.0f;
              const int ev = (int) x;

              if (ev == 1 || ev == 2) {
                float v = id(current_volume);
                if (ev == 1) {
                  v = std::min((float) ${max_volume}, v + volume_step);
                } else {
                  v = std::max(0.0f, v - volume_step);
                }
                auto call = id(echo_pyramid_player).make_call();
                call.set_volume(v);
                call.perform();
                id(current_volume) = v;
                id(master_volume).publish_state(v);
                id(show_volume_bar).execute();
              } else if (ev == 3 || ev == 4) {
                float b = id(rgb_master_brightness).state;
                if (ev == 3) {
                  b = std::min(100.0f, b + brightness_step);
                } else {
                  b = std::max(0.0f, b - brightness_step);
                }
                uint8_t b8 = (uint8_t) b;
                id(pyramid_rgb1).set_strip_brightness(1, b8);
                id(pyramid_rgb2).set_strip_brightness(2, b8);
                id(rgb_master_brightness).publish_state(b);
              }
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

lp5562:
  id: lp5562_led
  i2c_id: bsp_bus
  use_internal_clk: true
  white_current: 17.5

pyramidrgb:
  - id: pyramid_rgb1
    i2c_id: ext_bus
    address: 0x1A
    strip: 1
    brightness: 80
  - id: pyramid_rgb2
    i2c_id: ext_bus
    address: 0x1A
    strip: 2
    brightness: 80

number:
  - platform: template
    name: "Master Volume"
    id: master_volume
    icon: "mdi:volume-high"
    min_value: 0.0
    max_value: ${max_volume}
    step: 0.01
    restore_value: true
    initial_value: 0.3
    optimistic: true
    set_action:
      - lambda: |-
          float v = x;
          auto call = id(echo_pyramid_player).make_call();
          call.set_volume(v);
          call.perform();
          id(current_volume) = v;

  - platform: template
    name: "RGB Master Brightness"
    id: rgb_master_brightness
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t b = (uint8_t) x;
          id(pyramid_rgb1).set_strip_brightness(1, b);
          id(pyramid_rgb2).set_strip_brightness(2, b);

output:
  - platform: lp5562
    id: lp5562_white_channel
    lp5562_id: lp5562_led
    channel: white
  - platform: pyramidrgb
    id: rgb1_ch0_red
    pyramidrgb_id: pyramid_rgb1
    channel: 0
    color: red
  - platform: pyramidrgb
    id: rgb1_ch0_green
    pyramidrgb_id: pyramid_rgb1
    channel: 0
    color: green
  - platform: pyramidrgb
    id: rgb1_ch0_blue
    pyramidrgb_id: pyramid_rgb1
    channel: 0
    color: blue
  - platform: pyramidrgb
    id: rgb1_ch1_red
    pyramidrgb_id: pyramid_rgb1
    channel: 1
    color: red
  - platform: pyramidrgb
    id: rgb1_ch1_green
    pyramidrgb_id: pyramid_rgb1
    channel: 1
    color: green
  - platform: pyramidrgb
    id: rgb1_ch1_blue
    pyramidrgb_id: pyramid_rgb1
    channel: 1
    color: blue
  - platform: pyramidrgb
    id: rgb2_ch2_red
    pyramidrgb_id: pyramid_rgb2
    channel: 2
    color: red
  - platform: pyramidrgb
    id: rgb2_ch2_green
    pyramidrgb_id: pyramid_rgb2
    channel: 2
    color: green
  - platform: pyramidrgb
    id: rgb2_ch2_blue
    pyramidrgb_id: pyramid_rgb2
    channel: 2
    color: blue
  - platform: pyramidrgb
    id: rgb2_ch3_red
    pyramidrgb_id: pyramid_rgb2
    channel: 3
    color: red
  - platform: pyramidrgb
    id: rgb2_ch3_green
    pyramidrgb_id: pyramid_rgb2
    channel: 3
    color: green
  - platform: pyramidrgb
    id: rgb2_ch3_blue
    pyramidrgb_id: pyramid_rgb2
    channel: 3
    color: blue

# The four strip lights below are driven by the "Status LEDs" switch (assistant
# state colors). Turn that switch off to use them as normal lights.
light:
  - platform: monochromatic
    name: "LCD Backlight"
    id: lcd_backlight
    output: lp5562_white_channel
    icon: "mdi:television"
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: "Strip1 Group1"
    id: strip1_group1
    default_transition_length: 0s
    red: rgb1_ch0_red
    green: rgb1_ch0_green
    blue: rgb1_ch0_blue
    restore_mode: ALWAYS_OFF
  - platform: rgb
    name: "Strip1 Group2"
    id: strip1_group2
    default_transition_length: 0s
    red: rgb1_ch1_red
    green: rgb1_ch1_green
    blue: rgb1_ch1_blue
    restore_mode: ALWAYS_OFF
  - platform: rgb
    name: "Strip2 Group1"
    id: strip2_group1
    default_transition_length: 0s
    red: rgb2_ch2_red
    green: rgb2_ch2_green
    blue: rgb2_ch2_blue
    restore_mode: ALWAYS_OFF
  - platform: rgb
    name: "Strip2 Group2"
    id: strip2_group2
    default_transition_length: 0s
    red: rgb2_ch3_red
    green: rgb2_ch3_green
    blue: rgb2_ch3_blue
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------- Display
spi:
  clk_pin: GPIO15
  mosi_pin: GPIO21

display:
  - platform: mipi_spi
    id: atoms3r_lcd
    # AtomS3R units made from May 2026 on use an ST7735 panel instead of the
    # GC9107 (M5Stack AtomS3R docs, version change 2026.05.14). ESPHome 2026.10.2
    # has no M5STACK-ATOMS3R-ST7735 preset yet, so this rebuilds it by hand using
    # the values from esphome/esphome PR #18673 (panel RAM 132x132, visible 128x128).
    model: ST7735
    dc_pin: GPIO42
    reset_pin: GPIO48
    cs_pin: GPIO14
    data_rate: 20MHz
    dimensions:
      width: 128
      height: 128
      offset_width: 2
      offset_height: 1
      pad_width: 2
      pad_height: 3
    invert_colors: true
    rotation: 180°
    update_interval: 50ms   # ~20 fps for the animations
    # FALLBACK if the screen is still black or shows noise: replace everything
    # from "model:" down to "rotation:" with the config reported to work in
    # m5stack/esphome-yaml issue #104:
    #   model: M5CORE
    #   dimensions: {width: 128, height: 128, offset_width: 2, offset_height: 3, pad_width: 2, pad_height: 1}
    #   invert_colors: true
    #   rotation: 180°
    pages:
      # IDLE: soft breathing dot
      - id: idle_page
        lambda: |-
          it.fill(Color::BLACK);
          float t = millis() / 1000.0f;
          float s = 0.5f + 0.5f * sinf(t * 1.5f);
          int r = 6 + (int)(3 * s);
          it.filled_circle(64, 64, r, Color(0, 50 + (int)(70 * s), 110 + (int)(100 * s)));

      # LISTENING: sound pulse - rings expanding outward from a bright core
      - id: listening_page
        lambda: |-
          it.fill(Color::BLACK);
          float t = millis() / 1000.0f;
          for (int i = 0; i < 3; i++) {
            float p = fmodf(t * 0.9f + i / 3.0f, 1.0f);
            int r = 14 + (int)(p * 48);
            float fade = 1.0f - p;
            Color c(0, (int)(200 * fade), (int)(255 * fade));
            it.circle(64, 64, r, c);
            it.circle(64, 64, r - 1, c);
            it.circle(64, 64, r - 2, c);
          }
          float core = 0.5f + 0.5f * sinf(t * 10.0f);
          it.filled_circle(64, 64, 10 + (int)(3 * core), Color(0, 200, 255));

      # THINKING: rotating comet of dots
      - id: thinking_page
        lambda: |-
          it.fill(Color::BLACK);
          float t = millis() / 1000.0f;
          float head = fmodf(t * 8.0f, 8.0f);
          for (int i = 0; i < 8; i++) {
            float d = fmodf(head - i + 8.0f, 8.0f);
            float b = 1.0f - d / 8.0f;
            float ang = i * 3.14159265f / 4.0f - 1.5707963f;
            int x = 64 + (int)(38 * cosf(ang));
            int y = 64 + (int)(38 * sinf(ang));
            it.filled_circle(x, y, 4 + (int)(4 * b), Color((int)(255 * b), (int)(150 * b), (int)(30 * b)));
          }

      # REPLYING: equalizer bars bouncing
      - id: replying_page
        lambda: |-
          it.fill(Color::BLACK);
          float t = millis() / 1000.0f;
          for (int i = 0; i < 7; i++) {
            float h = 8 + 44 * (0.5f + 0.5f * sinf(t * 6.0f + i * 1.3f)) * (0.6f + 0.4f * sinf(t * 2.3f + i));
            int hh = (int) h;
            it.filled_rectangle(14 + i * 16, 64 - hh, 10, hh * 2, Color(80, 255, 120));
          }

      # ERROR: pulsing red circle with X
      - id: error_page
        lambda: |-
          it.fill(Color::BLACK);
          float s = 0.5f + 0.5f * sinf(millis() / 1000.0f * 8.0f);
          int v = 140 + (int)(115 * s);
          Color c(v, 0, 0);
          it.circle(64, 64, 42, c);
          it.circle(64, 64, 41, c);
          for (int k = -1; k <= 1; k++) {
            it.line(46 + k, 46, 82 + k, 82, c);
            it.line(82 + k, 46, 46 + k, 82, c);
          }

      # NO HOME ASSISTANT: slow pulsing magenta ring
      - id: no_ha_page
        lambda: |-
          it.fill(Color::BLACK);
          float s = 0.5f + 0.5f * sinf(millis() / 1000.0f * 3.0f);
          int v = 100 + (int)(155 * s);
          Color c(v, 0, v);
          it.circle(64, 64, 40, c);
          it.circle(64, 64, 39, c);
          it.filled_circle(64, 64, 6, c);

      # NO WIFI: pulsing orange ring
      - id: no_wifi_page
        lambda: |-
          it.fill(Color::BLACK);
          float s = 0.5f + 0.5f * sinf(millis() / 1000.0f * 3.0f);
          int v = 100 + (int)(155 * s);
          Color c(v, (int)(v * 0.5f), 0);
          it.circle(64, 64, 40, c);
          it.circle(64, 64, 39, c);
          it.filled_circle(64, 64, 6, c);

      # INITIALIZING: spinning white arc of dots
      - id: initializing_page
        lambda: |-
          it.fill(Color::BLACK);
          float t = millis() / 1000.0f;
          float head = fmodf(t * 6.0f, 8.0f);
          for (int i = 0; i < 8; i++) {
            float d = fmodf(head - i + 8.0f, 8.0f);
            float b = 1.0f - d / 8.0f;
            float ang = i * 3.14159265f / 4.0f - 1.5707963f;
            int x = 64 + (int)(30 * cosf(ang));
            int y = 64 + (int)(30 * sinf(ang));
            it.filled_circle(x, y, 3 + (int)(3 * b), Color((int)(220 * b), (int)(220 * b), (int)(220 * b)));
          }

      # MUTED: mic-off icon
      - id: muted_page
        lambda: |-
          it.fill(Color::BLACK);
          it.printf(it.get_width() / 2, it.get_height() / 2, id(mdi_icon_96), Color::WHITE, TextAlign::CENTER, "%s", "\U000F036D");

      # VOLUME: bar shown for 1.5 s after a volume swipe
      - id: volume_page
        lambda: |-
          it.fill(Color::BLACK);
          float f = id(current_volume) / ${max_volume};
          if (f < 0.0f) f = 0.0f;
          if (f > 1.0f) f = 1.0f;
          it.rectangle(14, 58, 100, 14, Color(110, 110, 110));
          it.filled_rectangle(16, 60, (int)(96 * f), 10, Color(0, 200, 255));
          for (int i = 0; i <= 10; i++) {
            it.line(16 + i * 9 + (i == 10 ? -1 : 0), 76, 16 + i * 9 + (i == 10 ? -1 : 0), 80, Color(110, 110, 110));
          }

script:
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: |-
              return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: |-
              return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(echo_pyramid_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(echo_pyramid_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(echo_pyramid_player)
              ->play_file(sound_file, true, false);
          }

  - id: draw_display
    then:
      - logger.log:
          level: VERBOSE   # hidden at the default DEBUG level; set logger level to VERBOSE to see it
          format: "draw_display: phase=%d init=%d wifi=%d"
          args: ['id(voice_assistant_phase)', 'id(init_in_progress) ? 1 : 0', 'wifi::global_wifi_component->is_connected() ? 1 : 0']
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(atoms3r_lcd).show_page(listening_page);
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(atoms3r_lcd).show_page(thinking_page);
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(atoms3r_lcd).show_page(replying_page);
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(atoms3r_lcd).show_page(error_page);
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(atoms3r_lcd).show_page(muted_page);
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(atoms3r_lcd).show_page(no_ha_page);
                                break;
                              default:
                                id(atoms3r_lcd).show_page(idle_page);
                            }
                            id(atoms3r_lcd).update();
                      else:
                        - display.page.show: no_ha_page
                        - component.update: atoms3r_lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: atoms3r_lcd
          else:
            - display.page.show: initializing_page
            - component.update: atoms3r_lcd
      # LEDs last: each color change takes ~0.4 s of slow I2C writes
      - script.execute: update_leds

  # Brief on-screen volume bar after a swipe, then back to the normal page
  - id: show_volume_bar
    mode: restart
    then:
      - display.page.show: volume_page
      - component.update: atoms3r_lcd
      - delay: 1500ms
      - script.execute: draw_display

  # Set all four Pyramid strips to one color (values 0.0 - 1.0)
  - id: set_led_color
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: strip1_group1
          red: !lambda return r;
          green: !lambda return g;
          blue: !lambda return b;
          brightness: 100%
      - light.turn_on:
          id: strip1_group2
          red: !lambda return r;
          green: !lambda return g;
          blue: !lambda return b;
          brightness: 100%
      - light.turn_on:
          id: strip2_group1
          red: !lambda return r;
          green: !lambda return g;
          blue: !lambda return b;
          brightness: 100%
      - light.turn_on:
          id: strip2_group2
          red: !lambda return r;
          green: !lambda return g;
          blue: !lambda return b;
          brightness: 100%

  - id: leds_off
    then:
      - light.turn_off:
          id: strip1_group1
          transition_length: 0s
      - light.turn_off:
          id: strip1_group2
          transition_length: 0s
      - light.turn_off:
          id: strip2_group1
          transition_length: 0s
      - light.turn_off:
          id: strip2_group2
          transition_length: 0s

  # Pick the strip color from the assistant phase. Overall brightness is
  # controlled by the "RGB Master Brightness" number / right-side swipes.
  - id: update_leds
    then:
      - if:
          condition:
            switch.is_off: status_leds
          then:
            - script.stop: update_leds
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - script.execute:
                id: set_led_color
                r: 1.0
                g: 0.6
                b: 0.0
            - script.stop: update_leds
      # Nothing to do if the strips already show this phase
      - if:
          condition:
            lambda: return id(led_applied_phase) == id(voice_assistant_phase);
          then:
            - script.stop: update_leds
      - lambda: id(led_applied_phase) = id(voice_assistant_phase);
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_listening_phase_id};
          then:
            - script.execute:
                id: set_led_color
                r: 0.0
                g: 0.8
                b: 1.0
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
          then:
            - script.execute:
                id: set_led_color
                r: 1.0
                g: 0.5
                b: 0.1
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
          then:
            - script.execute:
                id: set_led_color
                r: 0.3
                g: 1.0
                b: 0.45
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
          then:
            - script.execute:
                id: set_led_color
                r: 1.0
                g: 0.0
                b: 0.0
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id};
          then:
            - script.execute:
                id: set_led_color
                r: 0.35
                g: 0.0
                b: 0.0
      # Idle / not ready: strips off
      - if:
          condition:
            lambda: |-
              int p = id(voice_assistant_phase);
              return p != ${voice_assist_listening_phase_id} && p != ${voice_assist_thinking_phase_id} &&
                     p != ${voice_assist_replying_phase_id} && p != ${voice_assist_error_phase_id} &&
                     p != ${voice_assist_muted_phase_id};
          then:
            - script.execute: leds_off

font:
  - file: ${mdi_webfont_file}
    id: mdi_icon_96
    size: 96
    bpp: 4
    glyphs:
      - "\U000F036D" # mdi:microphone-off
