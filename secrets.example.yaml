# Copy this file to secrets.yaml (in your ESPHome config folder) and fill in
# your own values. Never commit secrets.yaml.

wifi_ssid: "YourWiFiName"
wifi_password: "YourWiFiPassword"

# 32-byte base64 key. Generate one with:  openssl rand -base64 32
# (or let the ESPHome dashboard generate it when you create a device)
api_key: "REPLACE_WITH_BASE64_32_BYTE_KEY"

ota_password: "REPLACE_WITH_OTA_PASSWORD"

# Password for the fallback hotspot the device opens if Wi-Fi fails
ap_password: "REPLACE_WITH_FALLBACK_AP_PASSWORD"
